# Familiar passages. The question files do not reserve slots for these.
# A drawn row is labeled famous when its citation is listed here.
# `version` is the edition the citation is taken from. `english_version`
# is named in the prompt when the answer is English; leave it blank when
# `version` is already that English edition. It may name a different edition
# from `version` (Uthmani Arabic versus an English Qur'an). Do not set
# `english_version` to an edition this corpus does not hold.
# `asked_as` / `asked_as_native` name a passage that has no standard citation
# to ask by (the Sri Guru Granth Sahib numbers no lines within an Ang, #135):
